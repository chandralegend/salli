name: Mobile release (EAS Build + Submit)

# Manual only — an App Store submission is a deliberate, costly action (review
# queue, can't be quietly undone), so this stays a "Run workflow" button
# rather than firing on every push. Everything after the click is automated:
# EAS manages signing credentials and the build number, this workflow just
# drives the build and (for "production") submits it.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "production submits to the App Store; preview only builds (internal distribution, no submission)"
        type: choice
        options:
          - production
          - preview
        default: production

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: clients/mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No eas-version pinned here — the action then uses the eas-cli already
      # installed by the previous step (pinned in package.json), which
      # respects pnpm-workspace.yaml's supply-chain allowBuilds exception.
      # Specifying eas-version makes the action `pnpm add` its own copy in an
      # isolated location outside the repo, which ignores that config and
      # fails on eas-cli's unapproved dtrace-provider build script.
      - uses: expo/expo-github-action@v9
        with:
          token: ${{ secrets.EXPO_TOKEN }}
          packager: pnpm

      # Only needed for the production profile's --auto-submit below — eas-cli
      # auto-detects these three well-known env var names, so nothing
      # credential-shaped needs to live in eas.json.
      - name: Write App Store Connect API key
        if: inputs.profile == 'production'
        run: echo "${{ secrets.ASC_API_KEY_P8_BASE64 }}" | base64 --decode > asc-api-key.p8

      - name: Build (production also auto-submits to the App Store)
        env:
          EXPO_ASC_API_KEY_PATH: asc-api-key.p8
          EXPO_ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          EXPO_ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          if [ "${{ inputs.profile }}" = "production" ]; then
            eas build --platform ios --profile production --non-interactive --auto-submit
          else
            eas build --platform ios --profile "${{ inputs.profile }}" --non-interactive
          fi

      - name: Remove App Store Connect API key
        if: always()
        run: rm -f asc-api-key.p8
