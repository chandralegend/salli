<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Years to financial independence by savings rate, assuming a 5 percent real return and a 25 times expenses target. Saving 10 percent takes 52 years, 20 percent takes 37, 30 percent takes 28, 40 percent takes 22, 50 percent takes 17, 60 percent takes 13 and 70 percent takes 9 years.">
  <rect width="1200" height="540" fill="#f2efe6"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="70" y="46" font-size="12.5" fill="#16130f" opacity="0.45" letter-spacing="1.6">YEARS TO FINANCIAL INDEPENDENCE · BY SAVINGS RATE</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#16130f">
    <line x1="130" y1="430" x2="1160" y2="430" stroke="#16130f" stroke-width="1.5"/>
    <line x1="130" y1="368.2" x2="1160" y2="368.2" stroke="#16130f" stroke-width="1" opacity="0.1"/>
    <text x="120" y="372.2" text-anchor="end" opacity="0.4">10</text>
    <line x1="130" y1="306.4" x2="1160" y2="306.4" stroke="#16130f" stroke-width="1" opacity="0.1"/>
    <text x="120" y="310.4" text-anchor="end" opacity="0.4">20</text>
    <line x1="130" y1="244.5" x2="1160" y2="244.5" stroke="#16130f" stroke-width="1" opacity="0.1"/>
    <text x="120" y="248.5" text-anchor="end" opacity="0.4">30</text>
    <line x1="130" y1="182.7" x2="1160" y2="182.7" stroke="#16130f" stroke-width="1" opacity="0.1"/>
    <text x="120" y="186.7" text-anchor="end" opacity="0.4">40</text>
    <line x1="130" y1="120.9" x2="1160" y2="120.9" stroke="#16130f" stroke-width="1" opacity="0.1"/>
    <text x="120" y="124.9" text-anchor="end" opacity="0.4">50</text>
    <text x="120" y="70" text-anchor="end" font-size="11" opacity="0.35">YEARS</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="132.0" y="112.5" width="76" height="317.5" fill="#16130f" opacity="0.28"/>
    <text x="170.0" y="100.5" text-anchor="middle" font-size="14" fill="#16130f" opacity="0.6" font-weight="400">52 yrs</text>
    <text x="170.0" y="456" text-anchor="middle" font-size="14" fill="#16130f">10%</text>
    <rect x="290.3" y="203.0" width="76" height="227.0" fill="#16130f" opacity="0.28"/>
    <text x="328.3" y="191.0" text-anchor="middle" font-size="14" fill="#16130f" opacity="0.6" font-weight="400">37 yrs</text>
    <text x="328.3" y="456" text-anchor="middle" font-size="14" fill="#16130f">20%</text>
    <rect x="448.7" y="257.0" width="76" height="173.0" fill="#16130f" opacity="0.28"/>
    <text x="486.7" y="245.0" text-anchor="middle" font-size="14" fill="#16130f" opacity="0.6" font-weight="400">28 yrs</text>
    <text x="486.7" y="456" text-anchor="middle" font-size="14" fill="#16130f">30%</text>
    <rect x="607.0" y="296.2" width="76" height="133.8" fill="#16130f" opacity="0.28"/>
    <text x="645.0" y="284.2" text-anchor="middle" font-size="14" fill="#16130f" opacity="0.6" font-weight="400">22 yrs</text>
    <text x="645.0" y="456" text-anchor="middle" font-size="14" fill="#16130f">40%</text>
    <rect x="765.3" y="327.3" width="76" height="102.7" fill="#f5310f" opacity="1"/>
    <text x="803.3" y="315.3" text-anchor="middle" font-size="14" fill="#f5310f" opacity="1" font-weight="700">17 yrs</text>
    <text x="803.3" y="456" text-anchor="middle" font-size="14" fill="#16130f">50%</text>
    <rect x="923.7" y="353.2" width="76" height="76.8" fill="#16130f" opacity="0.28"/>
    <text x="961.7" y="341.2" text-anchor="middle" font-size="14" fill="#16130f" opacity="0.6" font-weight="400">13 yrs</text>
    <text x="961.7" y="456" text-anchor="middle" font-size="14" fill="#16130f">60%</text>
    <rect x="1082.0" y="375.6" width="76" height="54.4" fill="#16130f" opacity="0.28"/>
    <text x="1120.0" y="363.6" text-anchor="middle" font-size="14" fill="#16130f" opacity="0.6" font-weight="400">9 yrs</text>
    <text x="1120.0" y="456" text-anchor="middle" font-size="14" fill="#16130f">70%</text>
    <text x="645" y="484" text-anchor="middle" font-size="11.5" fill="#16130f" opacity="0.85">SHARE OF INCOME SAVED</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#16130f" opacity="0.5">
    <text x="70" y="516">Your salary is not on this chart — only the share you keep. 5% real return, 25× annual expenses (the 4% rule), starting from zero.</text>
  </g>
</svg>