services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: salli
      POSTGRES_USER: salli
      POSTGRES_PASSWORD: salli
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salli -d salli"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
