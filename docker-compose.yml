services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: salli
      POSTGRES_USER: salli
      POSTGRES_PASSWORD: salli
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salli -d salli"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      # App DB now lives on the local Supabase Postgres (prod parity).
      # The docker `db` service remains as a dev fallback but is unused.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@host.docker.internal:54322/postgres
      ENVIRONMENT: development
    command: sh -c "alembic upgrade head && uvicorn salli.interfaces.api.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy
    # Reach the local Supabase stack (auth/storage) running on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ~/.salli/storage:/root/.salli/storage
      - ./src:/app/src        # hot-reload Python source

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile --ignore-scripts && pnpm dev"
    volumes:
      - ./clients/web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - api

  # Static marketing site (root domain in prod; localhost:3001 in dev)
  site:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --ignore-scripts && pnpm dev"
    volumes:
      - ./clients/site:/app
      - site_node_modules:/app/node_modules
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_APP_URL: http://localhost:3000

volumes:
  postgres_data:
  web_node_modules:
  site_node_modules:
